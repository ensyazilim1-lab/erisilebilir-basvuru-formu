<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Başvuru Formu</title>
</head>
<body>
    <form action="/basvuru" method="post">
        <fieldset>
    <legend>Kişisel ve Temel Bilgiler</legend>
      <label for="ad">Ad (Zorunlu):</label><br>
    <input type="text" id="ad" name="ad" autocomplete="given-name" required><br><br>

    <label for="soyad">Soyad (Zorunlu):</label><br>
    <input type="text" id="soyad" name="soyad" autocomplete="family-name" required><br><br>

    <label for="eposta">E-posta Adresi (Zorunlu):</label><br>
    <input type="email" id="eposta" name="eposta" autocomplete="email" required><br><br>

    <label for="telefon">Telefon Numarası (Zorunlu):</label><br>
    <input type="tel" id="telefon" name="telefon" autocomplete="tel" required><br><br>

    <label for="dogum">Doğum Tarihi (Zorunlu):</label><br>
    <input type="date" id="dogum" name="dogum" autocomplete="bday" required><br><br>

    <label for="tc">T.C. Kimlik Numarası (Zorunlu):</label><br>
    <input type="text" id="tc" name="tc" maxlength="11" required><br><br>

    <label for="meslek">Meslek (Zorunlu):</label><br>
    <input type="text" id="meslek" name="meslek" autocomplete="organization-title" required><br><br>

    <label for="sehir">Yaşadığınız Şehir (Zorunlu):</label><br>
    <input type="text" id="sehir" name="sehir" autocomplete="address-level1" required><br><br>

    <label for="ilce">İlçe (Zorunlu):</label><br>
    <input type="text" id="ilce" name="ilce" autocomplete="address-level2" required><br><br>

    <label for="posta_kodu">Posta Kodu (Zorunlu):</label><br>
    <input type="text" id="posta_kodu" name="posta_kodu" autocomplete="postal-code" required><br><br>

    <label for="baba_adi">Baba Adı (Zorunlu):</label><br>
    <input type="text" id="baba_adi" name="baba_adi" required><br><br>

    <label for="anne_adi">Anne Adı (Zorunlu):</label><br>
    <input type="text" id="anne_adi" name="anne_adi" required><br><br>

    <label for="dogum_yeri">Doğum Yeri (Zorunlu):</label><br>
    <input type="text" id="dogum_yeri" name="dogum_yeri" required><br><br>

    <label for="uyruk">Uyruk (Zorunlu):</label><br>
    <input type="text" id="uyruk" name="uyruk" autocomplete="country-name" required>
  </fieldset><br>

   <fieldset>
    <legend>İletişim, Kimlik ve Ek Bilgiler</legend>
      <label for="ulke">Ülke (Zorunlu):</label><br>
    <input type="text" id="ulke" name="ulke" autocomplete="country-name" required><br><br>

    <label for="web_site">Web Sitesi veya Portfolio (Zorunlu):</label><br>
    <input type="url" id="web_site" name="web_site" autocomplete="url" required><br><br>

    <label for="acil_kisi">Acil Durumda Aranacak Kişi (Zorunlu):</label><br>
    <input type="text" id="acil_kisi" name="acil_kisi" required><br><br>

    <label for="acil_tel">Acil Durum Telefonu (Zorunlu):</label><br>
    <input type="tel" id="acil_tel" name="acil_tel" required><br><br>

    <label for="universite">Üniversite / Okul Adı (Zorunlu):</label><br>
    <input type="text" id="universite" name="universite" required><br><br>

    <label for="mezuniyet">Mezuniyet Yılı (Zorunlu):</label><br>
    <input type="text" id="mezuniyet" name="mezuniyet" required><br><br>

    <label for="medeni_durum">Medeni Durum (Zorunlu):</label><br>
    <select id="medeni_durum" name="medeni_durum" required>
      <option value="">-- Seçiniz --</option>
      <option value="bekar">Bekar</option>
      <option value="evli">Evli</option>
    </select><br><br>

    <label for="surucu_belgesi">Sürücü Belgesi (Zorunlu):</label><br>
    <select id="surucu_belgesi" name="surucu_belgesi" required>
      <option value="">-- Seçiniz --</option>
      <option value="yok">Yok</option>
      <option value="b">B Sınıfı</option>
      <option value="a2">A2 Sınıfı</option>
      <option value="diger">Diğer</option>
    </select><br><br>

    <label for="askerlik">Askerlik Durumu (Zorunlu):</label><br>
    <select id="askerlik" name="askerlik" required>
      <option value="">-- Seçiniz --</option>
      <option value="yapildi">Yapıldı</option>
      <option value="tecilli">Tecilli</option>
      <option value="muaf">Muaf</option>
      <option value="ilgili_degil">İlgili Değil / Kadın</option>
    </select><br><br>

    <label for="yas">Yaşınız (Zorunlu):</label><br>
    <input type="text" id="yas" name="yas" required>
  </fieldset><br>


   <fieldset>
    <legend>Eğitim Tercihleri ve Detaylar</legend>
      <label for="ders">İlgilenilen Ders (Zorunlu):</label><br>
    <select id="ders" name="ders" required>
      <option value="">-- Seçiniz --</option>
      <option value="frontend">Frontend Web Development</option>
      <option value="backend">Backend Development</option>
      <option value="cybersecurity">Siber Güvenlik</option>
      <option value="mobil">Mobil Programlama</option>
    </select>
  </fieldset><br>

  <fieldset>
    <legend>Deneyim Düzeyi (Zorunlu)</legend>
    <label><input type="radio" name="deneyim" value="baslangic" required> Başlangıç</label><br>
    <label><input type="radio" name="deneyim" value="orta" required> Orta</label><br>
    <label><input type="radio" name="deneyim" value="ileri" required> İleri</label>
  </fieldset><br>

  <fieldset>
    <legend>İletişim ve Bildirim Tercihleri</legend>
    <p>İletişim Kanalları:</p>
    <label><input type="checkbox" name="iletisim_sms" value="1"> SMS ile bilgilendirilmek istiyorum.</label><br>
    <label><input type="checkbox" name="iletisim_email" value="1"> E-posta bültenine abone ol.</label>
  </fieldset><br>

  <fieldset>
    <legend>Mesaj ve Onaylar</legend>

    <label for="mesaj">Mesaj Alanı (Zorunlu):</label><br>
    <textarea id="mesaj" name="mesaj" rows="4" required></textarea><br><br>

    <label>
      <input type="checkbox" name="kvkk" required> KVKK Onayı (Zorunlu): Metni okudum ve kabul ediyorum.
    </label>
  </fieldset><br>

    <button type="submit">Başvuruyu Gönder</button>
  <button type="reset">Formu Temizle</button>
  <button type="button" onclick="alert('Kurallar okundu!')">Kuralları Göster</button>
</form>
















</body>
</html>
